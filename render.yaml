services:
  - type: web
    name: CogniTrack
    env: python

    buildCommand: |
      pip install -r requirements.txt

    # Runs once per deploy, before the new version receives traffic —
    # unlike startCommand, this does NOT re-run on every dyno
    # boot/restart/scale event, which matters once there's more than one
    # instance (concurrent `db upgrade` runs against the same database
    # would otherwise race).
    preDeployCommand: |
      flask --app run.py db upgrade

    startCommand: |
      gunicorn run:app
